<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAYAN Company (BCT) - Local Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root { --primary-gold: #b38f4f; --dark-gold: #8e6f37; --dark-bg: #111111; --card-bg: #1a1a1a; --text-light: #ffffff; --text-muted: #aaaaaa; --border-color: #333333; --success-green: #2ecc71; --error-red: #e74c3c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; overflow: hidden; }
        .portal-container { background-color: var(--card-bg); width: 100%; max-width: 420px; padding: 30px 20px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }
        .dashboard-container { display: none; background-color: var(--card-bg); width: 100%; max-width: 900px; height: 85vh; border-radius: 12px; border: 1px solid var(--border-color); grid-template-columns: 260px 1fr; overflow: hidden; }
        .logo-area { margin-bottom: 20px; }
        .logo-icon { font-size: 54px; font-weight: bold; color: var(--primary-gold); margin-bottom: 5px; font-family: 'Times New Roman', serif; }
        .company-name { font-size: 22px; font-weight: 700; text-transform: uppercase; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; text-transform: uppercase; color: var(--primary-gold); margin-bottom: 8px; }
        .input-group select, .input-group input { width: 100%; padding: 12px; background-color: #222; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 16px; }
        .login-btn { width: 100%; padding: 14px; background-color: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #message-box { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; }
        .error { background-color: rgba(231, 76, 60, 0.15); color: var(--error-red); border: 1px solid var(--error-red); }
        .sidebar { background-color: #111; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; }
        .chat-area { display: flex; flex-direction: column; background: #161616; flex: 1; }
        .messages-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; font-size: 14px; word-break: break-word; }
        .msg.received { background: #222; align-self: flex-start; border: 1px solid var(--border-color); }
        .msg.sent { background: var(--primary-gold); color: #111; align-self: flex-end; }
        .input-bar { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .input-bar input { flex: 1; padding: 12px; background: #111; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; }
        .send-btn { padding: 0 15px; background: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; }
        .logout-btn { padding: 10px; background: transparent; border: 1px solid var(--error-red); color: var(--error-red); border-radius: 6px; cursor: pointer; width: 100%; margin-top: auto;}
    </style>
</head>
<body>
    <div class="portal-container" id="loginScreen">
        <div class="logo-area"><div class="logo-icon">B</div><div class="company-name">Bayan Company</div></div>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Select Identity</label>
                <select id="portal-id" required>
                    <option value="" disabled selected>-- Select Member --</option>
                    <option value="Eng. Ahmed Nabil">Eng. Ahmed Nabil</option>
                    <option value="Eng. Youssef Nabil">Eng. Youssef Nabil</option>
                    <option value="Eng. Noha Alhaddad">Eng. Noha Alhaddad</option>
                    <option value="Eng. Nabil Hassan">Eng. Nabil Hassan</option>
                </select>
            </div>
            <div class="input-group">
                <label>Security Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="login-btn">Secure Local Login</button>
        </form>
        <div id="message-box"></div>
    </div>

    <div class="dashboard-container" id="dashboardScreen">
        <aside class="sidebar">
            <div style="font-weight:bold; color:var(--primary-gold); margin-bottom:20px;">BCT LOCAL PORTAL</div>
            <button class="logout-btn" onclick="location.reload()">Disconnect</button>
        </aside>
        <main class="chat-area">
            <div class="messages-window" id="messagesWindow"></div>
            <form class="input-bar" onsubmit="sendMessage(event)">
                <input type="text" id="typeBox" placeholder="Type a message..." autocomplete="off">
                <button type="submit" class="send-btn">Send</button>
            </form>
        </main>
    </div>

    <script>
        // Local Network Configuration
        const LOCAL_BROKER_IP = "192.168.8.147"; 
        const LOCAL_BROKER_PORT = "9001";
        
        const userCredentials = { 'Eng. Ahmed Nabil': 'Bayan2026', 'Eng. Youssef Nabil': 'Bayan2026', 'Eng. Noha Alhaddad': 'Bayan2026', 'Eng. Nabil Hassan': 'Bayan2026' };
        let currentActiveUser = "", client = null;

        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('portal-id').value;
            const pass = document.getElementById('password').value;
            
            if (userCredentials[id] === pass) {
                // Connection attempt to your local IP
                client = mqtt.connect(`ws://${LOCAL_BROKER_IP}:${LOCAL_BROKER_PORT}`);
                
                client.on('connect', () => {
                    currentActiveUser = id;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboardScreen').style.display = 'grid';
                });

                client.on('error', (err) => {
                    showError("Cannot connect to Local Network (192.168.8.147). Ensure you are connected to the correct Wi-Fi.");
                });
            } else {
                showError("Invalid Credentials.");
            }
        }

        function showError(msg) {
            const box = document.getElementById('message-box');
            box.className = "error"; box.innerText = msg; box.style.display = "block";
        }

        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('typeBox');
            if (input.value.trim() === "" || !client) return;
            client.publish("bayan/local", JSON.stringify({user: currentActiveUser, msg: input.value}));
            input.value = "";
        }
    </script>
</body>
</html>
